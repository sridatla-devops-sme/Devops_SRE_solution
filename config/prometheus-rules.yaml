apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memory-hog-alerts
  namespace: monitoring # Assuming Prometheus is installed in the 'monitoring' namespace
  labels:
    prometheus: k8s
spec:
  groups:
  - name: application-alerts
    rules:
    - alert: PodOOMKilled
      expr: kube_pod_container_status_terminated_reason{reason="OOMKilled"} > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} was OOMKilled"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been terminated due to Out Of Memory."
        
    - alert: ApplicationHealthCheckFailed
      expr: kube_pod_status_ready{condition="false"} > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} health check failed"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been unready for more than 2 minutes."
